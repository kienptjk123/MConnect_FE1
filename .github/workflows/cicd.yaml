name: CICD

on:
  push:
    branches:
      - ec2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t kienptjk123/mconnects .

      - name: Push Docker Image
        run: docker push kienptjk123/mconnects:latest

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Fix Docker Permissions
        run: |
          sudo usermod -aG docker $USER || true
          sudo systemctl start docker || true
          sudo chmod 666 /var/run/docker.sock || true

      - name: Pull image from Docker Hub
        run: sudo docker pull kienptjk123/mconnects:latest

      - name: Delete Old Container
        run: sudo docker rm -f reactContainer || true

      - name: Run Docker Container
        run: sudo docker run -d -p 3000:3000 --name reactContainer kienptjk123/mconnects:latest
